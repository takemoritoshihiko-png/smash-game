name: Smoke test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  smoketest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: browser-actions/setup-chrome@v1
      - name: 目次が 本文と そろっているか
        run: node tools/toc.mjs --check
      - name: ゲームが 壊れていないか（全31キャラ）
        run: node tools/smoketest.mjs
